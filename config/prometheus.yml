global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'yolo-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['api-server:8000']
  - job_name: 'yolo-inference'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inference-engine:8001']
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
