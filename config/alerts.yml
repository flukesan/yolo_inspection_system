groups:
  - name: yolo_inspection
    interval: 30s
    rules:
      - alert: APIServerDown
        expr: up{job="yolo-api"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "API Server is DOWN" }
      - alert: InferenceEngineDown
        expr: up{job="yolo-inference"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Inference Engine is DOWN" }
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL is DOWN" }
      - alert: HighNGRate
        expr: rate(yolo_ng_inspections_total[5m]) / rate(yolo_inspections_total[5m]) > 0.10
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "High NG Rate > 10%" }
      - alert: CriticalNGRate
        expr: rate(yolo_ng_inspections_total[5m]) / rate(yolo_inspections_total[5m]) > 0.25
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "CRITICAL NG Rate > 25%" }
      - alert: HighPipelineLatency
        expr: histogram_quantile(0.95, rate(yolo_pipeline_duration_ms_bucket[5m])) > 200
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "High Pipeline Latency" }
