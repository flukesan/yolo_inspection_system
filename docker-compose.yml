services:
  inference-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    ports: ["8001:8001"]
    environment:
      - PLC_HOST=${PLC_HOST:-192.168.1.10}
      - MODEL_PATH=/models/yolov8n_defect.onnx
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports: ["8000:8000"]
    env_file: .env.production
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports: ["5173:80"]
    depends_on:
      - api-server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yolo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yolo}
      POSTGRES_DB: ${POSTGRES_DB:-yolo_inspection}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
